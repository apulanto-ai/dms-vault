services:
  dms-vault:
    build: .
    container_name: dms-vault
    ports:
      - "8181:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      DMS_CONTAINER: Docker-Mailserver
      ADMIN_USER: admin
      ADMIN_PASSWORD: admin
    restart: unless-stopped
    network_mode: bridge
