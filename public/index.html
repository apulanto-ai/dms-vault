<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Docker Mailserver Admin</title>
  <script>
    (function () {
      const t = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <script defer src="/alpine.js"></script>
  <style>
    :root {
      --bg:           #0f172a;
      --surface:      #1e293b;
      --surface-hover:#263248;
      --border:       #334155;
      --text:         #e2e8f0;
      --text-bright:  #f1f5f9;
      --text-muted:   #94a3b8;
      --text-dim:     #64748b;
      --text-faint:   #475569;
      --input-bg:     #0f172a;
      --accent:       #3b82f6;
    }

    [data-theme="light"] {
      --bg:           #f1f5f9;
      --surface:      #ffffff;
      --surface-hover:#f0f4f8;
      --border:       #e2e8f0;
      --text:         #334155;
      --text-bright:  #0f172a;
      --text-muted:   #64748b;
      --text-dim:     #94a3b8;
      --text-faint:   #94a3b8;
      --input-bg:     #f8fafc;
      --accent:       #2563eb;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: background 0.2s, color 0.2s;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header h1 {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--text-bright);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    header h1 span.icon { font-size: 1.4rem; }

    .container {
      max-width: 900px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.25rem;
    }

    .toolbar h2 {
      font-size: 0.875rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: opacity 0.15s;
    }

    .btn:hover { opacity: 0.85; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-primary { background: var(--accent); color: #fff; }
    .btn-danger  { background: #ef4444; color: #fff; }
    .btn-ghost   { background: var(--surface); color: var(--text-muted); border: 1px solid var(--border); }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead tr { background: var(--bg); }

    th {
      padding: 0.75rem 1rem;
      text-align: left;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    td {
      padding: 0.875rem 1rem;
      border-top: 1px solid var(--surface);
      font-size: 0.9rem;
    }

    tbody tr { background: var(--surface); }
    tbody tr:hover { background: var(--surface-hover); }
    tbody tr:not(:last-child) td { border-bottom: 1px solid var(--border); }

    .email-cell {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .avatar {
      width: 2rem;
      height: 2rem;
      border-radius: 50%;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
    }

    .actions {
      display: flex;
      gap: 0.5rem;
      justify-content: flex-end;
    }

    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-faint);
    }

    .empty-state p { margin-top: 0.5rem; font-size: 0.875rem; }

    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 1rem;
    }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 1.5rem;
      width: 100%;
      max-width: 420px;
    }

    .modal h3 {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 1.25rem;
      color: var(--text-bright);
    }

    .form-group { margin-bottom: 1rem; }

    label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 0.35rem;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"] {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      padding: 0.6rem 0.75rem;
      color: var(--text-bright);
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.15s;
    }

    input:focus { border-color: var(--accent); }

    .modal-actions {
      display: flex;
      gap: 0.75rem;
      justify-content: flex-end;
      margin-top: 1.5rem;
    }

    .toast-container {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .toast {
      padding: 0.75rem 1.1rem;
      border-radius: 0.5rem;
      font-size: 0.875rem;
      font-weight: 500;
      max-width: 320px;
      animation: slideIn 0.2s ease;
    }

    .toast-success { background: #166534; color: #bbf7d0; border: 1px solid #15803d; }
    .toast-error   { background: #7f1d1d; color: #fecaca; border: 1px solid #991b1b; }

    @keyframes slideIn {
      from { transform: translateX(1rem); opacity: 0; }
      to   { transform: translateX(0);    opacity: 1; }
    }

    .spinner {
      display: inline-block;
      width: 1rem;
      height: 1rem;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    select {
      background: var(--surface);
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      padding: 0.35rem 0.6rem;
      font-size: 0.8rem;
      cursor: pointer;
      outline: none;
    }

    select option { background: var(--surface); color: var(--text); }
  </style>
</head>
<body x-data="app()">

  <header>
    <h1><span class="icon">✉</span> Docker Mailserver Admin</h1>
    <div style="display:flex;align-items:center;gap:0.75rem;font-size:0.8rem;">
      <span style="color:var(--text-faint);" x-text="'Container: ' + container"></span>
      <template x-if="containerStatus">
        <span style="display:flex;align-items:center;gap:0.35rem;">
          <span :style="'width:0.55rem;height:0.55rem;border-radius:50%;background:' + (containerStatus.running ? '#22c55e' : '#ef4444')"></span>
          <span :style="'color:' + (containerStatus.running ? '#86efac' : '#fca5a5')"
                x-text="containerStatus.running ? 'Läuft seit ' + uptime() : 'Gestoppt'"></span>
        </span>
      </template>
      <select @change="setRefresh(parseInt($event.target.value))" :value="refreshInterval"
              title="Auto-Refresh">
        <option value="0">Kein Refresh</option>
        <option value="10">10 s</option>
        <option value="30">30 s</option>
        <option value="60">1 min</option>
        <option value="300">5 min</option>
      </select>
      <button class="btn btn-ghost" @click="load()" :disabled="loading"
              style="padding:0.35rem 0.6rem;font-size:1rem;" title="Jetzt aktualisieren">↻</button>
      <button class="btn btn-ghost" @click="toggleTheme()"
              style="padding:0.35rem 0.6rem;font-size:0.85rem;"
              :title="theme === 'dark' ? 'Helles Design' : 'Dunkles Design'"
              x-text="theme === 'dark' ? '☀' : '☾'"></button>
    </div>
  </header>

  <div class="container">
    <div class="toolbar">
      <h2 x-text="accounts.length + ' Konto' + (accounts.length !== 1 ? 'en' : '')"></h2>
      <div style="display:flex;gap:0.5rem;">
        <button class="btn btn-ghost" @click="downloadBackup()" :disabled="backingUp">
          <span x-show="backingUp" class="spinner"></span>
          <span x-text="backingUp ? '' : '↓ Backup'"></span>
        </button>
        <button class="btn btn-primary" @click="openAdd()">+ Konto hinzufügen</button>
      </div>
    </div>

    <div class="card">
      <template x-if="loading">
        <div class="empty-state">
          <div class="spinner" style="width:2rem;height:2rem;margin:0 auto;"></div>
          <p>Lade Konten…</p>
        </div>
      </template>

      <template x-if="!loading && accounts.length === 0">
        <div class="empty-state">
          <div style="font-size:2.5rem">📭</div>
          <p>Noch keine E-Mail-Konten vorhanden.</p>
        </div>
      </template>

      <template x-if="!loading && accounts.length > 0">
        <table>
          <thead>
            <tr>
              <th>E-Mail-Adresse</th>
              <th>Speicher</th>
              <th style="text-align:right">Aktionen</th>
            </tr>
          </thead>
          <tbody>
            <template x-for="account in accounts" :key="account.email">
              <tr>
                <td>
                  <div class="email-cell">
                    <div class="avatar" x-text="account.email[0].toUpperCase()"></div>
                    <span x-text="account.email"></span>
                  </div>
                </td>
                <td style="font-size:0.8rem;color:var(--text-muted);">
                  <template x-if="account.limit === '~'">
                    <span>
                      <span x-text="account.diskLabel ?? '—'"
                            :style="account.diskLabel ? 'color:var(--text)' : 'color:var(--text-faint)'"></span>
                      <span style="color:var(--text-faint);margin-left:0.35rem;">/ kein Limit</span>
                    </span>
                  </template>
                  <template x-if="account.limit !== '~'">
                    <div>
                      <div x-text="account.used + ' / ' + account.limit + ' MB (' + account.pct + '%)'"></div>
                      <div style="margin-top:0.25rem;height:4px;background:var(--border);border-radius:2px;overflow:hidden;">
                        <div :style="'height:100%;border-radius:2px;background:' + (account.pct > 85 ? '#ef4444' : account.pct > 60 ? '#f59e0b' : '#3b82f6') + ';width:' + account.pct + '%'"></div>
                      </div>
                    </div>
                  </template>
                </td>
                <td>
                  <div class="actions">
                    <button class="btn btn-ghost" @click="openPassword(account.email)">🔑 Passwort</button>
                    <button class="btn btn-danger" @click="confirmDelete(account.email)">🗑</button>
                  </div>
                </td>
              </tr>
            </template>
          </tbody>
        </table>
      </template>
    </div>

    <template x-if="!loading && totalDisk()">
      <div style="margin-top:0.6rem;font-size:0.78rem;color:var(--text-faint);text-align:right;"
           x-text="totalDisk()"></div>
    </template>
  </div>

  <!-- Add Account Modal -->
  <div class="modal-bg" x-show="modal === 'add'" x-cloak @click.self="modal = null">
    <div class="modal">
      <h3>Neues Konto erstellen</h3>
      <div class="form-group">
        <label>E-Mail-Adresse</label>
        <input type="email" x-model="form.email" placeholder="user@example.com" @keyup.enter="submitAdd()" />
      </div>
      <div class="form-group">
        <label>Passwort</label>
        <input type="password" x-model="form.password" placeholder="Mindestens 6 Zeichen" @keyup.enter="submitAdd()" />
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" @click="modal = null">Abbrechen</button>
        <button class="btn btn-primary" @click="submitAdd()" :disabled="saving">
          <span x-show="saving" class="spinner"></span>
          <span x-text="saving ? '' : 'Erstellen'"></span>
        </button>
      </div>
    </div>
  </div>

  <!-- Change Password Modal -->
  <div class="modal-bg" x-show="modal === 'password'" x-cloak @click.self="modal = null">
    <div class="modal">
      <h3>Passwort ändern</h3>
      <p style="font-size:0.85rem;color:var(--text-muted);margin-bottom:1rem;" x-text="form.email"></p>
      <div class="form-group">
        <label>Neues Passwort</label>
        <input type="password" x-model="form.password" placeholder="Mindestens 6 Zeichen" @keyup.enter="submitPassword()" />
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" @click="modal = null">Abbrechen</button>
        <button class="btn btn-primary" @click="submitPassword()" :disabled="saving">
          <span x-show="saving" class="spinner"></span>
          <span x-text="saving ? '' : 'Speichern'"></span>
        </button>
      </div>
    </div>
  </div>

  <!-- Delete Confirm Modal -->
  <div class="modal-bg" x-show="modal === 'delete'" x-cloak @click.self="modal = null">
    <div class="modal">
      <h3>Konto löschen?</h3>
      <p style="font-size:0.875rem;color:var(--text-muted);margin-bottom:1.5rem;">
        Das Konto <strong x-text="form.email" style="color:var(--text-bright)"></strong> wird unwiderruflich gelöscht.
      </p>
      <div class="modal-actions">
        <button class="btn btn-ghost" @click="modal = null">Abbrechen</button>
        <button class="btn btn-danger" @click="submitDelete()" :disabled="saving">
          <span x-show="saving" class="spinner"></span>
          <span x-text="saving ? '' : 'Löschen'"></span>
        </button>
      </div>
    </div>
  </div>

  <!-- Toasts -->
  <div class="toast-container">
    <template x-for="(t, i) in toasts" :key="i">
      <div class="toast" :class="t.type === 'error' ? 'toast-error' : 'toast-success'" x-text="t.msg"></div>
    </template>
  </div>

  <script>
    function app() {
      return {
        accounts: [],
        loading: true,
        saving: false,
        modal: null,
        container: '',
        containerStatus: null,
        backingUp: false,
        theme: localStorage.getItem('theme') || 'dark',
        refreshInterval: parseInt(localStorage.getItem('refreshInterval') || '60', 10),
        _refreshTimer: null,
        form: { email: '', password: '' },
        toasts: [],

        init() {
          this.applyRefresh();
          this.load();
        },

        setRefresh(seconds) {
          this.refreshInterval = seconds;
          localStorage.setItem('refreshInterval', seconds);
          this.applyRefresh();
        },

        applyRefresh() {
          if (this._refreshTimer) clearInterval(this._refreshTimer);
          if (this.refreshInterval > 0) {
            this._refreshTimer = setInterval(() => this.load(), this.refreshInterval * 1000);
          }
        },

        async load() {
          this.loading = true;
          try {
            const r = await fetch('/api/accounts');
            if (!r.ok) throw new Error((await r.json()).error);
            this.accounts = await r.json();
            const [meta, status] = await Promise.all([
              fetch('/api/meta').catch(() => null),
              fetch('/api/status').catch(() => null),
            ]);
            if (meta && meta.ok) this.container = (await meta.json()).container;
            if (status && status.ok) this.containerStatus = await status.json();
          } catch (e) {
            this.toast('error', 'Fehler: ' + e.message);
          } finally {
            this.loading = false;
          }
        },

        async downloadBackup() {
          this.backingUp = true;
          try {
            const r = await fetch('/api/backup');
            if (!r.ok) throw new Error('Backup fehlgeschlagen');
            const blob = await r.blob();
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `dms-backup-${new Date().toISOString().slice(0, 10)}.tar.gz`;
            a.click();
            URL.revokeObjectURL(url);
            this.toast('success', 'Backup heruntergeladen');
          } catch (e) {
            this.toast('error', e.message);
          } finally {
            this.backingUp = false;
          }
        },

        toggleTheme() {
          this.theme = this.theme === 'dark' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', this.theme);
          localStorage.setItem('theme', this.theme);
        },

        totalDisk() {
          const withDisk = this.accounts.filter(a => a.diskKb !== null && a.diskKb !== undefined);
          if (withDisk.length === 0) return '';
          const totalKb = withDisk.reduce((sum, a) => sum + a.diskKb, 0);
          let label;
          if (totalKb >= 1024 * 1024) label = (totalKb / (1024 * 1024)).toFixed(1) + ' GB';
          else if (totalKb >= 1024) label = (totalKb / 1024).toFixed(1) + ' MB';
          else label = totalKb + ' KB';
          return label + ' gesamt';
        },

        openAdd() {
          this.form = { email: '', password: '' };
          this.modal = 'add';
        },

        openPassword(email) {
          this.form = { email, password: '' };
          this.modal = 'password';
        },

        confirmDelete(email) {
          this.form = { email, password: '' };
          this.modal = 'delete';
        },

        async submitAdd() {
          this.saving = true;
          try {
            const r = await fetch('/api/accounts', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(this.form),
            });
            const data = await r.json();
            if (!r.ok) throw new Error(data.error);
            this.modal = null;
            this.toast('success', `${this.form.email} erstellt`);
            await this.load();
          } catch (e) {
            this.toast('error', e.message);
          } finally {
            this.saving = false;
          }
        },

        async submitPassword() {
          this.saving = true;
          try {
            const r = await fetch(`/api/accounts/${encodeURIComponent(this.form.email)}/password`, {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ password: this.form.password }),
            });
            const data = await r.json();
            if (!r.ok) throw new Error(data.error);
            this.modal = null;
            this.toast('success', 'Passwort geändert');
          } catch (e) {
            this.toast('error', e.message);
          } finally {
            this.saving = false;
          }
        },

        async submitDelete() {
          this.saving = true;
          try {
            const r = await fetch(`/api/accounts/${encodeURIComponent(this.form.email)}`, {
              method: 'DELETE',
            });
            const data = await r.json();
            if (!r.ok) throw new Error(data.error);
            this.modal = null;
            this.toast('success', `${this.form.email} gelöscht`);
            await this.load();
          } catch (e) {
            this.toast('error', e.message);
          } finally {
            this.saving = false;
          }
        },

        uptime() {
          if (!this.containerStatus?.startedAt) return '';
          const ms = Date.now() - new Date(this.containerStatus.startedAt).getTime();
          const h = Math.floor(ms / 3600000);
          const m = Math.floor((ms % 3600000) / 60000);
          if (h >= 24) return `${Math.floor(h / 24)}d ${h % 24}h`;
          if (h > 0) return `${h}h ${m}m`;
          return `${m}m`;
        },

        toast(type, msg) {
          this.toasts.push({ type, msg });
          setTimeout(() => this.toasts.shift(), 3500);
        },
      };
    }
  </script>
</body>
</html>
